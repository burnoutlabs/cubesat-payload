# LibreCube Board Specification: open, CubeSat-Kit-style board outline.
# Every leaf is { value, unit, kind, source, note? }; see README "Data provenance".

[meta]
namespace = "librecube"
title = "LibreCube Board Specification (outline subset)"
note = "The page carries no version or date (read 2026-11-05). Docs are CC BY 4.0; dimensions are facts and are re-entered here, not copied geometry. The H1/H2 pin allocation is in librecube-pinout.toml."

[[meta.documents]]
id = "LibreCube board spec"
title = "LibreCube Board Specification"
revision = "unversioned"
effective = "read 2026-11-05"
url = "https://librecube.codeberg.page/docs/standards/board_specification/"

[board.size]
value = [90.0, 96.0]
unit = "mm"
kind = "rule"
source = "LibreCube board spec, board_dimensions.png"

[board.thickness]
value = 1.6
unit = "mm"
kind = "rule"
source = "LibreCube board spec"

[board.corner_radius]
value = 1.0
unit = "mm"
kind = "rule"
source = "LibreCube board spec"

[board.holes]
value = [[5.0, 5.0], [85.0, 5.0], [9.0, 91.0], [82.5, 91.0]]
unit = "mm"
kind = "rule"
source = "LibreCube board spec, board_dimensions.png"
note = "From the bottom-left origin. Agrees with the PC/104 pattern to about 0.1 to 0.3 mm (derived)."

[board.hole_diameter]
value = 3.2
unit = "mm"
kind = "rule"
source = "LibreCube board spec, board_dimensions.png"

[component_height.top]
value = 8.5
unit = "mm"
kind = "rule"
source = "LibreCube board spec"

[component_height.bottom]
value = 4.5
unit = "mm"
kind = "rule"
source = "LibreCube board spec"

[stack_pitch]
value = 16.0
unit = "mm"
kind = "rule"
source = "LibreCube board spec"
